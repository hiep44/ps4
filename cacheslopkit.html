<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIỆP PS4 - QUANTUM SLOPKIT</title>
    <style>
        :root {
            --tf-cyan: #00f0ff;
            --tf-orange: #ffe600;
            --tf-red: #ff3b30;
            --bg-deep: #05080f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at center, rgba(0, 240, 255, 0.12) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            transform: translateZ(0);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(8, 15, 30, 0.85);
            border: 3px solid var(--tf-cyan);
            border-radius: 10px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 240, 255, 0.4);
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; height: 4px;
            background: var(--tf-orange);
            box-shadow: 0 0 10px var(--tf-orange);
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--tf-cyan);
        }

        .sub {
            color: var(--tf-orange);
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--tf-orange);
        }

        .status {
            background: rgba(12, 22, 40, 0.7);
            border-left: 6px solid var(--tf-cyan);
            border-top: 1px solid rgba(30, 58, 138, 0.3);
            border-right: 1px solid rgba(30, 58, 138, 0.3);
            border-bottom: 1px solid rgba(30, 58, 138, 0.3);
            border-radius: 6px;
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #ffffff;
            line-height: 1.5;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--tf-cyan);
            border-radius: 50%;
            flex-shrink: 0;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">HIỆP PS4 • ADVANCED FW</div>
        <div class="sub">HOTLINE: 0982440044</div>
        <div class="status">
            <div class="spinner"></div>
            <span id="msgs">Firmware cao từ 11.02 đến 13.52 có tỷ lệ kick thành công là 85% . Chúc bạn may mắn</span>
        </div>
    </div>

    <script src="slopkit/jb.js?v=10" type="module"></script>
</body>

</html>
