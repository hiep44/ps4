<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIỆP PS4 - QUANTUM MATRIX SYSTEM</title>
    <style>
        :root {
            --tf-cyan: #00f3ff;
            --tf-orange: #ff5500;
            --tf-yellow: #ffe600;
            --tf-green: #00ff66;
            --tf-red: #ff003c;
            --bg-deep: #010306;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        #matrix-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            color: var(--tf-cyan);
            overflow: hidden;
            line-height: 1;
        }

        .overlay-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 50% 40%, rgba(255, 85, 0, 0.15) 0%, transparent 70%);
            background-size: 35px 35px, 35px 35px, 100% 100%;
            z-index: 2;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(4, 8, 16, 0.94);
            border: 2px solid var(--tf-cyan);
            border-radius: 8px;
            padding: 35px 30px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3), 
                        inset 0 0 25px rgba(255, 85, 0, 0.15);
            position: relative;
            z-index: 10;
            clip-path: polygon(
                0 20px, 20px 0, 
                calc(100% - 20px) 0, 100% 20px, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                20px 100%, 0 calc(100% - 20px)
            );
        }

        .container::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 2px dashed var(--tf-orange);
            z-index: -1;
            opacity: 0.6;
            animation: borderPulse 4s infinite alternate;
            clip-path: polygon(
                0 20px, 20px 0, 
                calc(100% - 20px) 0, 100% 20px, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                20px 100%, 0 calc(100% - 20px)
            );
        }

        @keyframes borderPulse {
            from { opacity: 0.3; filter: drop-shadow(0 0 2px var(--tf-orange)); }
            to { opacity: 0.8; filter: drop-shadow(0 0 10px var(--tf-orange)); }
        }

        .header-badge {
            display: inline-block;
            background: rgba(255, 85, 0, 0.15);
            border: 1px solid var(--tf-orange);
            color: var(--tf-orange);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .title {
            color: #fff;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--tf-cyan), 0 0 20px var(--tf-cyan);
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .subtitle span {
            color: var(--tf-yellow);
        }

        .row {
            background: rgba(12, 18, 32, 0.9);
            border-left: 5px solid var(--tf-cyan);
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 3px;
            padding: 16px 20px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            color: #94a3b8;
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 15px;
            text-transform: uppercase;
        }

        .value {
            font-weight: 800;
            color: #fff;
            font-size: 16px;
            text-align: right;
            text-shadow: 0 0 6px rgba(255,255,255,0.5);
        }

        .ok { color: var(--tf-green); text-shadow: 0 0 10px var(--tf-green); }
        .bad { color: var(--tf-red); text-shadow: 0 0 10px var(--tf-red); }
        .warn { color: var(--tf-yellow); text-shadow: 0 0 10px var(--tf-yellow); }

        .loader-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .mini-loader {
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 85, 0, 0.3);
            border-top-color: var(--tf-orange);
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div id="matrix-bg">HIỆP PS4 • 0982440044 • QUANTUM MATRIX • SYSTEM READY • JAILBREAK •</div>
    <div class="overlay-grid"></div>

    <div class="container">
        <div class="header-badge">ĐẶC QUYỀN HỆ THỐNG</div>
        <div class="title">HIỆP PS4 JAILBREAK</div>
        <div class="subtitle">HOTLINE MUA BÁN TRAO ĐỔI PS4: <span>0982440044</span> • HỖ TRỢ FW 5.05 - 13.52</div>

        <div class="row">
            <span class="label">FIRMWARE</span>
            <span class="value" id="fw-info">Đang kiểm tra...</span>
        </div>

        <div class="row">
            <span class="label">CÔNG CỤ</span>
            <span class="value" style="color: var(--tf-cyan);">GoldHEN v2.4b18.12</span>
        </div>

        <div class="row">
            <span class="label">GIAO THỨC</span>
            <span class="value">QUANTUM MATRIX v3.0</span>
        </div>

        <div class="row">
            <span class="label">TRẠNG THÁI</span>
            <span class="value" id="msgs">
                <span class="loader-box">
                    <span class="mini-loader"></span>
                    <span class="warn">Đang khởi tạo ma trận...</span>
                </span>
            </span>
        </div>
    </div>

    <script>
        (function() {
            var bg = document.getElementById('matrix-bg');
            var text = "HIỆP PS4 • 0982440044 • PROTOCOL ACTIVE • SYSTEM ONLINE • ";
            var content = "";
            for(var i=0; i<15; i++) { content += text + "<br>"; }
            bg.innerHTML = content;
        })();

        (function () {
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            var fwVersion = isPS4 ? match[1] : "Unknown";
            var fwNum = parseFloat(fwVersion);

            var fwInfo = document.getElementById("fw-info");
            var msgs = document.getElementById("msgs");

            function setStatus(msgText, cls) {
                msgs.innerHTML = '<span class="' + (cls || '') + '">' + msgText + '</span>';
            }

            function onScriptError() {
                setStatus("Lỗi tệp! Xóa bộ nhớ đệm & Cài lại Cache...", "bad");
            }

            function loadScriptWithDelay(actionCallback) {
                // Đặt độ trễ 8 giây (8000 mili-giây) để khách hàng kịp đọc thông tin
                setStatus("Đang hiển thị thông tin hệ thống (8s)...", "warn");
                setTimeout(function() {
                    setStatus("Đang nạp dữ liệu khai thác...", "warn");
                    actionCallback();
                }, 8000);
            }

            function loadScript(srcPath, isModule, onLoadCb) {
                var script = document.createElement('script');
                if (isModule) script.type = 'module';
                script.src = srcPath;
                script.onerror = onScriptError;
                script.onload = function () {
                    if (onLoadCb) onLoadCb();
                    setTimeout(function () {
                        if (script.parentNode) script.parentNode.removeChild(script);
                    }, 1000);
                };
                document.head.appendChild(script);
            }

            if (!isPS4) {
                fwInfo.textContent = "Không phải PS4";
                setStatus("Chỉ hỗ trợ phần cứng PlayStation 4", "bad");
            } else {
                fwInfo.innerHTML = fwVersion + ' · <span class="ok">SẴN SÀNG</span>';

                if (window.applicationCache && window.applicationCache.status == 0) {
                    loadScriptWithDelay(function() {
                        if (fwNum == 5.05 || fwNum == 5.07) {
                            window.location.replace("cache505.html");
                        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
                            window.location.replace("cache700.html");
                        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                            window.location.replace("cache900.html");
                        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                            window.location.replace("cachecss.html");
                        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
                            window.location.replace("cacheslopkit.html");
                        } else {
                    } else {
                            fwInfo.innerHTML = fwVersion + ' · <span class="bad">KHÔNG HỖ TRỢ</span>';
                            setStatus("Phiên bản Firmware ngoài vùng phủ sóng", "bad");
                        }
                    });
                } else {
                    loadScriptWithDelay(function() {
                        if (fwNum == 5.05 || fwNum == 5.07) {
                            loadScript("505/exploit.js", false);
                        }
                        else if (fwNum >= 7.00 && fwNum <= 8.52) {
                            loadScript("700/alert.js", true);
                        }
                        else if (fwNum >= 9.00 && fwNum <= 9.60) {
                            loadScript("900/alert.js", true);
                        }
                        else if (fwNum >= 10.00 && fwNum <= 11.02) {
                            loadScript("css/main.js", false, function () {
                                setTimeout(function () {
                                    if (typeof doJb === "function") doJb();
                                }, 500);
                            });
                        }
                        else if (fwNum >= 11.50 && fwNum <= 12.02) {
                            loadScript("slopkit/chain_lapse.js", true);
                        }
                        else if (fwNum >= 12.50 && fwNum <= 13.00) {
                            loadScript("slopkit/chain_poops.js", true);
                        }
                        else if (fwNum >= 13.02 && fwNum <= 13.52) {
                            loadScript("slopkit/jb.js?v=10", true);
                        }
                    });
                }
            }
        })();
    </script>
</body>

</html>
