<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUTO JAILBREAK PS4 - 0982440044</title>
    <style>
        :root {
            --theme-primary: #00f0ff;
            --theme-secondary: #ffe600;
            --bg-image: url('https://i.postimg.cc/Pfv3zVYh/wp15382470.jpg');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: #05080f;
            background-image: linear-gradient(rgba(5, 8, 15, 0.3), rgba(5, 8, 15, 0.5)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            /* Tối ưu hóa hiệu năng GPU cho PS4 */
            will-change: background-image;
            transform: translateZ(0);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(8, 15, 30, 0.88);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 3px solid var(--theme-primary);
            border-radius: 10px;
            padding: 28px 24px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px var(--theme-primary);
            position: relative;
            transform: translateZ(0);
        }

        .container::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; height: 4px;
            background: var(--theme-secondary);
            box-shadow: 0 0 10px var(--theme-secondary);
        }

        .title {
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--theme-primary);
        }

        .subtitle {
            color: var(--theme-secondary);
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--theme-secondary);
        }

        /* Menu chọn game AAA */
        .game-picker {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .game-btn {
            background: rgba(15, 25, 45, 0.9);
            border: 2px solid #1e3a8a;
            color: #93c5fd;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .game-btn.active, .game-btn:hover {
            background: rgba(0, 240, 255, 0.25);
            border-color: var(--theme-primary);
            color: #ffffff;
            box-shadow: 0 0 12px var(--theme-primary);
        }

        .row {
            background: rgba(12, 22, 40, 0.85);
            border-left: 6px solid var(--theme-primary);
            border-top: 1px solid rgba(30, 58, 138, 0.6);
            border-right: 1px solid rgba(30, 58, 138, 0.6);
            border-bottom: 1px solid rgba(30, 58, 138, 0.6);
            border-radius: 4px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .label {
            color: #93c5fd;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .value {
            font-weight: 800;
            text-align: right;
            word-break: break-all;
            color: #ffffff;
        }

        /* Khung Cảnh Báo Rủi Ro */
        .warning-box {
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.4);
            border-left: 6px solid #ff3b30;
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.5;
            color: #fca5a5;
        }

        .warning-title {
            color: #ff3b30;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 6px rgba(255, 59, 48, 0.5);
        }

        /* Nút Jailbreak thủ công (Manual Trigger) */
        .jb-btn-container {
            text-align: center;
        }

        .jb-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
            color: #05080f;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--theme-primary);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .jb-btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .jb-btn:active {
            transform: scale(0.98);
        }

        .jb-btn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .ok { color: #00ff66; text-shadow: 0 0 8px #00ff66; }
        .bad { color: #ff1e38; text-shadow: 0 0 8px #ff1e38; }
        .warn { color: var(--theme-secondary); text-shadow: 0 0 8px var(--theme-secondary); }

        .loader-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .mini-loader {
            width: 14px;
            height: 14px;
            border: 3px solid rgba(255, 119, 0, 0.3);
            border-top-color: var(--theme-secondary);
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="container" id="main-container">
        <div class="title" id="launcher-title">AUTO JAILBREAK PS4</div>
        <div class="subtitle" id="launcher-subtitle">0982440044 • MUA BÁN TRAO ĐỔI PLAYSTATION 4</div>

        <!-- Khung chọn game -->
        <div class="game-picker">
            <button class="game-btn active" onclick="setTheme('cyberpunk', event)">Cyberpunk</button>
            <button class="game-btn" onclick="setTheme('gow', event)">God of War</button>
            <button class="game-btn" onclick="setTheme('sekiro', event)">Sekiro</button>
            <button class="game-btn" onclick="setTheme('witcher', event)">Witcher 3</button>
        </div>

        <div class="row">
            <span class="label">Firmware</span>
            <span class="value" id="fw-info">Đang kiểm tra...</span>
        </div>

        <div class="row">
            <span class="label">Tải trọng</span>
            <span class="value">GoldHEN v2.4b18.12</span>
        </div>

        <div class="row">
            <span class="label">Chủ đề hiện tại</span>
            <span class="value" id="theme-name" style="color: var(--theme-primary);">Cyberpunk 2077</span>
        </div>

        <div class="row">
            <span class="label">Trạng thái</span>
            <span class="value" id="msgs">Đang kiểm tra hệ thống...</span>
        </div>

        <!-- Khung Cảnh Báo -->
        <div class="warning-box">
            <div class="warning-title">⚠️ Cảnh báo quan trọng</div>
            JailBreak có tỷ lệ thành công chỉ là ~90% (nếu thất bại máy của bạn có thể bị sập nguồn).
        </div>

        <!-- Nút bấm Jailbreak thủ công (Manual Trigger) -->
        <div class="jb-btn-container">
            <button id="jb-action-btn" class="jb-btn" onclick="startJailbreak()" disabled>ĐANG KIỂM TRA MÁY...</button>
        </div>
    </div>

    <script>
        // Cấu hình thông tin và link ảnh của bro
        const themes = {
            cyberpunk: {
                primary: "#00f0ff",
                secondary: "#ffe600",
                image: "url('https://i.postimg.cc/132qyBCr/thumb-1920-1355218.jpg')",
                name: "Cyberpunk 2077"
            },
            gow: {
                primary: "#ff3b30",
                secondary: "#ffcc00",
                image: "url('https://i.postimg.cc/bwkmcZLD/kratos-ghost-of-3840x2160-16038.jpg')",
                name: "God of War (Runic)"
            },
            sekiro: {
                primary: "#ff8800",
                secondary: "#e2e8f0",
                image: "url('https://i.postimg.cc/0yDVRzZJ/sekiro-gameplay-overview-trailer-1-1200x450.jpg')",
                name: "Sekiro: Shadows Die Twice"
            },
            witcher: {
                primary: "#10b981",
                secondary: "#94a3b8",
                image: "url('https://i.postimg.cc/DwLxkS5r/thumb-1920-587508.png')",
                name: "The Witcher 3 (Wolf)"
            }
        };

        // Tự động Preload (tải ngầm) toàn bộ hình nền ngay từ đầu để chuyển game không bị khựng
        window.addEventListener('DOMContentLoaded', () => {
            Object.values(themes).forEach(t => {
                const img = new Image();
                const cleanUrl = t.image.replace(/url\(['"](.+)['"]\)/, '$1');
                img.src = cleanUrl;
            });

            // Khôi phục chủ đề đã chọn lần trước
            try {
                const savedTheme = localStorage.getItem('ps4_preferred_theme');
                if (savedTheme && themes[savedTheme]) {
                    const btn = Array.from(document.querySelectorAll('.game-btn')).find(b => b.getAttribute('onclick').includes(savedTheme));
                    if (btn) {
                        document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const t = themes[savedTheme];
                        document.documentElement.style.setProperty('--theme-primary', t.primary);
                        document.documentElement.style.setProperty('--theme-secondary', t.secondary);
                        document.documentElement.style.setProperty('--bg-image', t.image);
                        document.getElementById('theme-name').textContent = t.name;
                    }
                }
            } catch(e){}

            initCheckEnvironment();
        });

        function setTheme(themeKey, evt) {
            const t = themes[themeKey];
            const root = document.documentElement;
            
            root.style.setProperty('--theme-primary', t.primary);
            root.style.setProperty('--theme-secondary', t.secondary);
            root.style.setProperty('--bg-image', t.image);

            document.getElementById('theme-name').textContent = t.name;

            document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }

            try { localStorage.setItem('ps4_preferred_theme', themeKey); } catch(e){}
        }

        var globalFwNum = 0;
        var isPS4Valid = false;

        // Kiểm tra phần cứng và firmware
        function initCheckEnvironment() {
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            var fwVersion = isPS4 ? match[1] : "Unknown";
            globalFwNum = parseFloat(fwVersion);

            var fwInfo = document.getElementById("fw-info");
            var msgs = document.getElementById("msgs");
            var jbBtn = document.getElementById("jb-action-btn");

            if (!isPS4) {
                fwInfo.textContent = "Không phải PS4";
                msgs.innerHTML = '<span class="bad">Chỉ hỗ trợ máy PS4</span>';
                jbBtn.textContent = "KHÔNG HỖ TRỢ";
            } else {
                if (window.applicationCache && window.applicationCache.status == 0) {
                    fwInfo.innerHTML = fwVersion + ' · <span class="ok">Cache sẵn sàng</span>';
                    msgs.innerHTML = 'Sẵn sàng chuyển hướng Cache';
                    jbBtn.textContent = "▶ ĐI TỚI CACHE EXPLOIT";
                    jbBtn.removeAttribute("disabled");
                    isPS4Valid = true;
                } else {
                    if (globalFwNum == 5.05 || globalFwNum == 5.07 || 
                        (globalFwNum >= 7.00 && globalFwNum <= 13.52)) {
                        fwInfo.innerHTML = fwVersion + ' · <span class="ok">Được hỗ trợ</span>';
                        msgs.innerHTML = 'Nhấn nút bên dưới để chạy Jailbreak';
                        jbBtn.textContent = "▶ TIẾN HÀNH JAILBREAK";
                        jbBtn.removeAttribute("disabled");
                        isPS4Valid = true;
                    } else {
                        fwInfo.innerHTML = fwVersion + ' · <span class="bad">Không hỗ trợ</span>';
                        msgs.innerHTML = '<span class="bad">Firmware ngoài vùng hỗ trợ</span>';
                        jbBtn.textContent = "FW KHÔNG HỢP LỆ";
                    }
                }
            }
        }

        // Hàm thực thi khi người dùng bấm nút Jailbreak thủ công
        function startJailbreak() {
            if (!isPS4Valid) return;

            var msgs = document.getElementById("msgs");
            var jbBtn = document.getElementById("jb-action-btn");
            
            jbBtn.setAttribute("disabled", "true");
            jbBtn.textContent = "ĐANG KHỞI CHẠY...";

            msgs.innerHTML = '<span class="loader-box"><span class="mini-loader"></span><span class="warn">Đang tải tệp tải trọng...</span></span>';

            function onScriptError() {
                msgs.innerHTML = '<span class="bad">Lỗi tải tệp! Xóa bộ nhớ cache web & thử lại.</span>';
                jbBtn.removeAttribute("disabled");
                jbBtn.textContent = "▶ THỬ LẠI JAILBREAK";
            }

            function loadScript(srcPath, isModule, onLoadCb) {
                var script = document.createElement('script');
                if (isModule) script.type = 'module';
                script.src = srcPath;
                script.onerror = onScriptError;
                script.onload = function () {
                    if (onLoadCb) onLoadCb();
                };
                document.head.appendChild(script);
            }

            if (window.applicationCache && window.applicationCache.status == 0) {
                if (globalFwNum == 5.05 || globalFwNum == 5.07) {
                    window.location.replace("cache505.html");
                } else if (globalFwNum >= 7.00 && globalFwNum <= 8.52) {
                    window.location.replace("cache700.html");
                } else if (globalFwNum >= 9.00 && globalFwNum <= 9.60) {
                    window.location.replace("cache900.html");
                } else if (globalFwNum >= 10.00 && globalFwNum <= 11.02) {
                    window.location.replace("cachecss.html");
                } else if (globalFwNum >= 11.50 && globalFwNum <= 13.52) {
                    window.location.replace("cacheslopkit.html");
                }
            } else {
                if (globalFwNum == 5.05 || globalFwNum == 5.07) {
                    loadScript("505/exploit.js", false);
                }
                else if (globalFwNum >= 7.00 && globalFwNum <= 8.52) {
                    loadScript("700/alert.js", true);
                }
                else if (globalFwNum >= 9.00 && globalFwNum <= 9.60) {
                    loadScript("900/alert.js", true);
                }
                else if (globalFwNum >= 10.00 && globalFwNum <= 11.02) {
                    loadScript("css/main.js", false, function () {
                        setTimeout(function () {
                            typeof doJb === "function" && doJb();
                        }, 500);
                    });
                }
                else if (globalFwNum >= 11.50 && globalFwNum <= 12.02) {
                    loadScript("slopkit/chain_lapse.js", true);
                }
                else if (globalFwNum >= 12.50 && globalFwNum <= 13.00) {
                    loadScript("slopkit/chain_poops.js", true);
                }
                else if (globalFwNum >= 13.02 && globalFwNum <= 13.52) {
                    loadScript("slopkit/jb.js?v=10", true);
                }
            }
        }
    </script>
</body>

</html>
