<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIỆP PS4 - MATRIX 11.00</title>
    <style>
        :root {
            --tf-cyan: #00f0ff;
            --tf-orange: #ffe600;
            --tf-red: #ff3b30;
            --bg-deep: #05080f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at center, rgba(0, 240, 255, 0.12) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            transform: translateZ(0);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(8, 15, 30, 0.85);
            border: 3px solid var(--tf-cyan);
            border-radius: 10px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 240, 255, 0.4);
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; height: 4px;
            background: var(--tf-orange);
            box-shadow: 0 0 10px var(--tf-orange);
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--tf-cyan);
        }

        .sub {
            color: var(--tf-orange);
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--tf-orange);
        }

        .status {
            background: rgba(12, 22, 40, 0.7);
            border-left: 6px solid var(--tf-cyan);
            border-top: 1px solid rgba(30, 58, 138, 0.3);
            border-right: 1px solid rgba(30, 58, 138, 0.3);
            border-bottom: 1px solid rgba(30, 58, 138, 0.3);
            border-radius: 6px;
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--tf-cyan);
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        .progress-box {
            background: rgba(10, 16, 28, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 800;
            color: #93c5fd;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .countdown-text {
            color: var(--tf-orange);
            text-shadow: 0 0 6px var(--tf-orange);
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--tf-cyan), var(--tf-orange));
            box-shadow: 0 0 10px var(--tf-cyan);
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">HIỆP PS4 • FW 10.00 - 11.02</div>
        <div class="sub">HOTLINE: 0982440044</div>
        
        <div class="status">
            <div class="spinner"></div>
            <span id="msgs">Đang thực thi mã PPPoE / CSS...</span>
        </div>

        <div class="progress-box">
            <div class="progress-info">
                <span>TIẾN TRÌNH: <span id="percent-text" style="color: var(--tf-cyan);">0%</span></span>
                <span class="countdown-text">TỰ ĐỘNG THỰC THI TRONG: <span id="timer-text">10</span>S</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var totalSeconds = 10;
            var currentMs = 0;
            var totalMs = totalSeconds * 1000;
            var intervalMs = 100;

            var fillEl = document.getElementById('progress-fill');
            var percentEl = document.getElementById('percent-text');
            var timerEl = document.getElementById('timer-text');

            var progressInterval = setInterval(function() {
                currentMs += intervalMs;
                var percentage = Math.min(Math.round((currentMs / totalMs) * 100), 100);
                var secondsLeft = Math.max(Math.ceil((totalMs - currentMs) / 1000), 0);

                if (fillEl) fillEl.style.width = percentage + '%';
                if (percentEl) percentEl.textContent = percentage + '%';
                if (timerEl) timerEl.textContent = secondsLeft;

                if (currentMs >= totalMs) {
                    clearInterval(progressInterval);
                }
            }, intervalMs);
        })();
    </script>

    <script src="css/main.js"></script>
    <script>
        setTimeout(function() { if (typeof doJb === "function") doJb(); }, 500);
    </script>
</body>

</html>
