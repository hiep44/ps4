<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 AUTO HOST SELECTOR</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; text-align: center; padding-top: 20vh; }
        h1 { color: #0088ff; }
        .msg { font-size: 18px; color: #8c9ba5; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>ĐANG KIỂM TRA PHIÊN BẢN FIRMWARE...</h1>
    <div class="msg" id="msg">Vui lòng chờ trong giây lát...</div>

    <script>
        var ua = navigator.userAgent;
        var msg = document.getElementById('msg');

        // Nhận diện FW qua UserAgent của PS4 Browser
        if (ua.indexOf("PlayStation 4") !== -1) {
            if (ua.indexOf("5.05") !== -1) {
                msg.textContent = "Phát hiện FW 5.05 - Đang chuyển hướng...";
                setTimeout(() => { window.location.href = "cache505.html"; }, 1000);
            } else if (ua.indexOf("7.00") !== -1 || ua.indexOf("7.02") !== -1 || ua.indexOf("7.55") !== -1) {
                msg.textContent = "Phát hiện FW 7.xx - Đang chuyển hướng...";
                setTimeout(() => { window.location.href = "cache700.html"; }, 1000);
            } else if (ua.indexOf("9.00") !== -1) {
                msg.textContent = "Phát hiện FW 9.00 - Đang chuyển hướng...";
                setTimeout(() => { window.location.href = "cache900.html"; }, 1000);
            } else if (ua.indexOf("11.00") !== -1 || ua.indexOf("13.52") !== -1) {
                msg.textContent = "Phát hiện FW cao (PPPwn / Slopkit) - Đang chuyển hướng...";
                setTimeout(() => { window.location.href = "cacheslopkit.html"; }, 1000);
            } else {
                msg.textContent = "Phát hiện FW 9.xx/CSS - Đang chuyển hướng...";
                setTimeout(() => { window.location.href = "cachecss.html"; }, 1000);
            }
        } else {
            msg.textContent = "Bạn đang truy cập từ Máy tính/Điện thoại. Hãy mở trang này bằng Trình duyệt PS4.";
        }
    </script>
</body>
</html>
