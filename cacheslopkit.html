<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIỆP PS4 - QUANTUM SLOPKIT</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-gold: #ffcc00;
            --bg-dark: #070a12;
            --panel-bg: rgba(12, 18, 32, 0.95);
            --border-color: rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        /* Card Khung HUD Sci-Fi Vát Góc */
        .container {
            width: 100%;
            max-width: 680px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            /* Vát 4 góc kiểu Tech/Console UI */
            clip-path: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            padding: 30px 25px;
            text-align: center;
            position: relative;
            transform: translateZ(0);
        }

        /* Viền sáng mỏng phía trên */
        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        }

        /* Header Bar */
        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 4px 10px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .sub {
            color: var(--neon-gold);
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 22px;
            letter-spacing: 2px;
        }

        /* Khung Status Nhìn như Terminal */
        .status {
            background: rgba(5, 10, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid var(--neon-cyan);
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #d1d5db;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-icon {
            color: var(--neon-cyan);
            font-size: 16px;
        }

        /* Khung Progress Bar Sang Trọng */
        .progress-box {
            background: rgba(5, 10, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .val-cyan { color: var(--neon-cyan); }
        .val-gold { color: var(--neon-gold); }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-gold));
            transition: width 0.25s linear;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-tag"><span class="dot"></span> MATRIX SYSTEM ONLINE</div>
        <div class="title">HIỆP PS4 • ADVANCED FW</div>
        <div class="sub">HOTLINE: 0982440044</div>
        
        <div class="status">
            <span class="status-icon">❖</span>
            <span id="msgs">Firmware 11.02 - 13.52: Tỉ lệ kick thành công 85%. Chúc bạn may mắn!</span>
        </div>

        <div class="progress-box">
            <div class="progress-info">
                <span>TIẾN TRÌNH KHAI THÁC: <span id="percent-text" class="val-cyan">0%</span></span>
                <span>DỰ KIẾN: <span id="timer-text" class="val-gold">25</span>S</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Đoạn đếm ngược 25s tối ưu cho Slopkit -->
    <script>
        (function() {
            var totalSeconds = 25;
            var currentMs = 0;
            var totalMs = totalSeconds * 1000;
            var intervalMs = 250;

            var fillEl = document.getElementById('progress-fill');
            var percentEl = document.getElementById('percent-text');
            var timerEl = document.getElementById('timer-text');

            var progressInterval = setInterval(function() {
                currentMs += intervalMs;
                var percentage = Math.min(Math.round((currentMs / totalMs) * 100), 100);
                var secondsLeft = Math.max(Math.ceil((totalMs - currentMs) / 1000), 0);

                if (fillEl) fillEl.style.width = percentage + '%';
                if (percentEl) percentEl.textContent = percentage + '%';
                if (timerEl) timerEl.textContent = secondsLeft;

                if (currentMs >= totalMs) {
                    clearInterval(progressInterval);
                }
            }, intervalMs);
        })();
    </script>

    <script src="slopkit/jb.js?v=10" type="module"></script>
</body>

</html>
