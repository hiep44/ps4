<!DOCTYPE html>
<html lang="vi" manifest="505.manifest">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CACHE SYSTEM - 0982440044</title>
    <style>
        :root {
            --tf-blue: #00e5ff;
            --tf-orange: #ff6600;
            --tf-yellow: #ffcc00;
            --tf-red: #ff1a1a;
            --bg-deep: #030508;
            --panel-bg: rgba(8, 12, 20, 0.92);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-deep);
            background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .container {
            width: 100%; max-width: 680px; background: var(--panel-bg); border: 2px solid var(--tf-blue); padding: 35px 30px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
            clip-path: polygon(0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px));
        }
        .title { color: #fff; text-align: center; font-size: 26px; font-weight: 900; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 0 0 10px var(--tf-blue); }
        .subtitle { color: var(--tf-orange); text-align: center; font-size: 14px; font-weight: 800; letter-spacing: 2px; margin-bottom: 25px; text-shadow: 0 0 8px var(--tf-orange); }
        .row { background: rgba(15, 23, 42, 0.85); border-left: 5px solid var(--tf-blue); border: 1px solid rgba(0,229,255,0.2); padding: 18px 22px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 16px; }
        .label { color: #94a3b8; font-weight: 800; }
        .value { font-weight: 800; color: #fff; }
        .ok { color: #00ff66; text-shadow: 0 0 10px #00ff66; }
        .bad { color: var(--tf-red); text-shadow: 0 0 10px var(--tf-red); }
        .warn { color: var(--tf-yellow); text-shadow: 0 0 10px var(--tf-yellow); }
    </style>
    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);

        function DLProgress(e) {
            var percent = Math.round(e.loaded / e.total * 100);
            var msgs = document.getElementById("msgs");
            if (msgs) msgs.innerHTML = '<span class="warn">Đang lưu Cache ngoại tuyến: ' + percent + '%</span>';
        }
        function DisplayCacheProgress() {
            var msgs = document.getElementById("msgs");
            if (msgs) {
                msgs.innerHTML = '<span class="ok">Lưu Cache thành công! Vui lòng khởi động lại trình duyệt.</span>';
            }
        }
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = DisplayCacheProgress;
        window.applicationCache.onupdateready = DisplayCacheProgress;
        window.applicationCache.onerror = function() {
            var msgs = document.getElementById("msgs");
            if (msgs) msgs.innerHTML = '<span class="bad">Lỗi nạp Cache! Vui lòng xóa dữ liệu web cũ.</span>';
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="title">AUTOBOT SYSTEM CACHE</div>
        <div class="subtitle">0982440044 • GIAO THỨC OFFLINE (FW 5.05)</div>
        <div class="row"><span class="label">TRẠNG THÁI CACHE</span><span class="value" id="msgs"><span class="warn">Đang kết nối khối dữ liệu...</span></span></div>
    </div>
</body>
</html>
