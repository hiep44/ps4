<!DOCTYPE html>
<html lang="vi" manifest="slopkit.manifest">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CACHE SYSTEM - FW 11.50-13.52</title>
    <style>
        :root { --tf-blue: #00f3ff; --tf-orange: #ff5500; --tf-yellow: #ffe600; --tf-red: #ff003c; --bg-deep: #020408; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 85, 0, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(0, 243, 255, 0.2) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow: hidden;
        }
        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }
        .container {
            width: 100%; max-width: 750px; background: rgba(8, 12, 22, 0.9); backdrop-filter: blur(20px);
            border: 2px solid var(--tf-blue); border-radius: 6px; padding: 40px 35px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.35), inset 0 0 30px rgba(255, 85, 0, 0.2);
            position: relative;
            clip-path: polygon(0 25px, 25px 0, calc(100% - 25px) 0, 100% 25px, 100% calc(100% - 25px), calc(100% - 25px) 100%, 25px 100%, 0 calc(100% - 25px));
        }
        .title { color: #fff; text-align: center; font-size: 32px; font-weight: 900; letter-spacing: 2.5px; margin-bottom: 8px; text-shadow: 0 0 10px var(--tf-blue), 0 0 25px var(--tf-blue); }
        .subtitle { color: var(--tf-orange); text-align: center; font-size: 16px; font-weight: 800; letter-spacing: 4px; margin-bottom: 35px; text-shadow: 0 0 10px var(--tf-orange); }
        .row {
            background: rgba(15, 23, 42, 0.85); border-left: 6px solid var(--tf-blue);
            border-right: 1px solid rgba(0, 243, 255, 0.3); border-top: 1px solid rgba(0, 243, 255, 0.3); border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 4px; padding: 20px 25px; margin-bottom: 16px; display: flex; justify-content: space-between; font-size: 17px;
        }
        .label { color: #94a3b8; font-weight: 800; letter-spacing: 1.5px; }
        .value { font-weight: 800; color: #fff; }
        .ok { color: #00ff66; text-shadow: 0 0 15px #00ff66; }
        .bad { color: var(--tf-red); text-shadow: 0 0 15px #ff003c; }
        .warn { color: var(--tf-yellow); text-shadow: 0 0 15px #ffe600; }
    </style>
    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);

        function DLProgress(e) {
            var percent = Math.round(e.loaded / e.total * 100);
            var msgs = document.getElementById("msgs");
            if (msgs) msgs.innerHTML = '<span class="warn">Đang lưu Cache ngoại tuyến: ' + percent + '%</span>';
        }
        function DisplayCacheProgress() {
            var msgs = document.getElementById("msgs");
            if (msgs) msgs.innerHTML = '<span class="ok">Lưu Cache thành công! Vui lòng khởi động lại trình duyệt.</span>';
        }
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = DisplayCacheProgress;
        window.applicationCache.onupdateready = DisplayCacheProgress;
        window.applicationCache.onerror = function() {
            var msgs = document.getElementById("msgs");
            if (msgs) msgs.innerHTML = '<span class="bad">Lỗi nạp Cache! Xóa dữ liệu web cũ.</span>';
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="title">AUTOBOT SYSTEM CACHE</div>
        <div class="subtitle">0982440044 • OFFLINE PROTOCOL (FW 11.50 - 13.52)</div>
        <div class="row"><span class="label">TRẠNG THÁI</span><span class="value" id="msgs"><span class="warn">Đang kết nối khối dữ liệu...</span></span></div>
    </div>
</body>
</html>
