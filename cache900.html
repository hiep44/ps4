<!DOCTYPE html>
<html manifest="900.manifest">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER EXPLOIT CORE - CACHE 900</title>
  <style>
    :root {
      --sc-bg: #04060a;
      --sc-panel: rgba(10, 16, 26, 0.9);
      --sc-cyan: #00f0ff;
      --sc-pink: #ff0055;
      --sc-yellow: #ffe600;
      --sc-dim: #3a4a63;
      --sc-red: #ff2255;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--sc-bg);
      color: var(--sc-cyan);
      font-family: 'Consolas', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      transform: translateZ(0);
    }

    .hud-core {
      width: 100%;
      max-width: 660px;
      background: var(--sc-panel);
      border: 1px solid rgba(0, 240, 255, 0.3);
      clip-path: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.1);
      position: relative;
    }

    .hud-core::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--sc-cyan), transparent);
    }

    .hud-header {
      background: rgba(0, 240, 255, 0.05);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--sc-yellow);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.4);
    }

    .hud-hotline {
      font-size: 11px;
      color: var(--sc-cyan);
      border: 1px solid var(--sc-cyan);
      padding: 3px 8px;
      letter-spacing: 1px;
      background: rgba(0, 240, 255, 0.1);
    }

    .hud-body {
      padding: 20px;
    }

    .module-grid {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
    }

    .module-box {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-left: 3px solid var(--sc-pink);
      padding: 10px 12px;
    }

    .module-tag {
      font-size: 10px;
      color: var(--sc-dim);
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .module-val {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .terminal-box {
      background: #020305;
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 16px;
      margin-bottom: 15px;
      position: relative;
    }

    .terminal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 10px;
      color: var(--sc-cyan);
      letter-spacing: 1px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--sc-yellow);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px var(--sc-yellow);
    }

    .terminal-output {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      min-height: 22px;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>

  <div class="hud-core">
    <div class="hud-header">
      <div class="hud-title">AUTO JAILBREAK // HIỆP 44</div>
      <div class="hud-hotline">TEL: 0982.440.044</div>
    </div>

    <div class="hud-body">
      <div class="module-grid">
        <div class="module-box">
          <div class="module-tag">TARGET FW</div>
          <div class="module-val">9.00</div>
        </div>
        <div class="module-box">
          <div class="module-tag">PAYLOAD</div>
          <div class="module-val">GoldHEN v2.4b16</div>
        </div>
      </div>

      <div class="terminal-box">
        <div class="terminal-head">
          <span>SYSTEM STATUS</span>
          <span class="pulse-dot"></span>
        </div>
        <div class="terminal-output" id="msgs">Đang chuẩn bị hệ thống...</div>
      </div>
    </div>
  </div>

  <script>
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);

    function DLProgress(e) {
      var Percent = (Math.round(e.loaded / e.total * 100));
      document.getElementById("msgs").innerHTML = "Đang cài đặt Cache Offline: " + Percent + "%";
    }

    function DisplayCacheProgress() {
      document.getElementById("msgs").innerHTML = "Đã cài đặt Cache thành công ✔";
      setTimeout(function () {
        document.getElementById("msgs").innerHTML = "Đang kích hoạt Jailbreak...";
        runExploit();
      }, 1000);
    }

    function runExploit() {
      // Kiểm tra và gọi hàm nạp Payload từ các file JS đính kèm
      if (typeof loadGoldHEN === "function") {
        loadGoldHEN();
      } else if (typeof poc === "function") {
        poc();
      } else {
        document.getElementById("msgs").innerHTML = "Đang thực thi Webkit Exploit...";
      }
    }

    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function (e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
    window.applicationCache.onerror = function (e) {
      // Khi đã lưu cache trước đó (chạy Offline), tự động chạy Exploit ngay
      runExploit();
    };
  </script>

  <!-- Đảm bảo khai báo đúng đường dẫn các file JS exploit/payload của bạn ở đây -->
  <script src="exploit.js"></script>
  <script src="goldhen.js"></script>

</body>
</html>
