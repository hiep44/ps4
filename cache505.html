<!DOCTYPE html>
<html lang="vi" manifest="505.manifest">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUTO JAILBREAK PS4 - 0982440044</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --neon-yellow: #ffe600;
            --bg-dark: #07090f;
            --card-bg: rgba(13, 17, 28, 0.85);
            --row-bg: rgba(20, 26, 43, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.08), transparent 25%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), 
                        inset 0 0 20px rgba(0, 243, 255, 0.05);
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 16px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink), var(--neon-blue));
            z-index: -1;
            opacity: 0.3;
            animation: borderGlow 4s linear infinite;
        }

        @keyframes borderGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .title {
            color: #fff;
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
        }

        .subtitle {
            color: #a0aec0;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .row {
            background: var(--row-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .row:hover {
            background: rgba(30, 40, 65, 0.8);
            border-color: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .label {
            color: #cbd5e1;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .value {
            font-weight: 700;
            text-align: right;
            word-break: break-all;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .ok {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        .bad {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        .warn {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .loader-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .mini-loader {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 243, 255, 0.2);
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s infinite linear, loaderGlow 1.5s infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes loaderGlow {
            from { box-shadow: 0 0 5px var(--neon-blue); }
            to { box-shadow: 0 0 15px var(--neon-blue); }
        }
    </style>
    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);

        function DLProgress(e) {
            var percent = Math.round(e.loaded / e.total * 100);
            var msgs = document.getElementById("msgs");
            if (msgs) {
                msgs.innerHTML = '<span class="loader-box"><span class="mini-loader"></span><span class="warn">Đang lưu Cache: ' + percent + '%</span></span>';
            }
        }

        function DisplayCacheProgress() {
            var msgs = document.getElementById("msgs");
            if (msgs) {
                msgs.innerHTML = '<span class="ok">Lưu Cache thành công! ✔</span>';
                setTimeout(function() {
                    msgs.innerHTML = '<span class="warn">Hãy đóng và mở lại trình duyệt...</span>';
                }, 1500);
            }
        }

        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onerror = function(e) {
            var msgs = document.getElementById("msgs");
            if (msgs) {
                msgs.innerHTML = '<span class="bad">Lỗi cài Cache! Vui lòng xóa dữ liệu trang...</span>';
            }
        };
    </script>
</head>
<body>

    <div class="container">
        <div class="title">AUTO JAILBREAK PS4</div>
        <div class="subtitle">0982440044 • CẤU HÌNH BỘ NHỚ OFFLINE (FW 5.05)</div>

        <div class="row">
            <span class="label">PHIÊN BẢN</span>
            <span class="value ok">FW 5.05 / 5.07</span>
        </div>

        <div class="row">
            <span class="label">MANIFEST</span>
            <span class="value">505.manifest</span>
        </div>

        <div class="row">
            <span class="label">TRẠNG THÁI</span>
            <span class="value" id="msgs">
                <span class="loader-box">
                    <span class="mini-loader"></span>
                    <span class="warn">Đang chuẩn bị cài Cache...</span>
                </span>
            </span>
        </div>
    </div>

</body>
</html>
