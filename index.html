<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUTO JAILBREAK PS4 - ULTIMATE MATRIX</title>
    <style>
        :root {
            --tf-blue: #00f3ff;
            --tf-orange: #ff5500;
            --tf-yellow: #ffe600;
            --tf-red: #ff003c;
            --bg-deep: #020408;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            /* Background hoành tráng: Hiệu ứng không gian vũ trụ kết hợp lưới năng lượng Cyberpunk */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 85, 0, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(0, 243, 255, 0.2) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Hiệu ứng quét màn hình phong cách Cyberpunk */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(8, 12, 22, 0.9);
            backdrop-filter: blur(20px);
            border: 2px solid var(--tf-blue);
            border-radius: 6px;
            padding: 40px 35px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.35), 
                        inset 0 0 30px rgba(255, 85, 0, 0.2);
            position: relative;
            /* Cấu trúc cắt góc Robot Transformer cực ngầu */
            clip-path: polygon(
                0 25px, 25px 0, 
                calc(100% - 25px) 0, 100% 25px, 
                100% calc(100% - 25px), calc(100% - 25px) 100%, 
                25px 100%, 0 calc(100% - 25px)
            );
        }

        /* Viền sáng năng lượng ma trận bao quanh */
        .container::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 2px dashed var(--tf-orange);
            z-index: -1;
            opacity: 0.7;
            animation: matrixRotate 15s linear infinite;
            clip-path: polygon(
                0 25px, 25px 0, 
                calc(100% - 25px) 0, 100% 25px, 
                100% calc(100% - 25px), calc(100% - 25px) 100%, 
                25px 100%, 0 calc(100% - 25px)
            );
        }

        @keyframes matrixRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .title {
            color: #fff;
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--tf-blue), 0 0 25px var(--tf-blue), 0 0 40px var(--tf-blue);
        }

        .subtitle {
            color: var(--tf-orange);
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 35px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--tf-orange), 0 0 20px var(--tf-orange);
        }

        .row {
            background: rgba(15, 23, 42, 0.85);
            border-left: 6px solid var(--tf-blue);
            border-right: 1px solid rgba(0, 243, 255, 0.3);
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 4px;
            padding: 20px 25px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 17px;
            transition: all 0.3s ease;
        }

        .row:hover {
            background: rgba(0, 243, 255, 0.12);
            border-left-color: var(--tf-orange);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transform: translateX(6px);
        }

        .label {
            color: #94a3b8;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 16px;
        }

        .value {
            font-weight: 800;
            text-align: right;
            word-break: break-all;
            color: #fff;
            font-size: 17px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        }

        .ok {
            color: #00ff66;
            text-shadow: 0 0 15px #00ff66;
        }

        .bad {
            color: var(--tf-red);
            text-shadow: 0 0 15px var(--tf-red);
        }

        .warn {
            color: var(--tf-yellow);
            text-shadow: 0 0 15px var(--tf-yellow);
        }

        .loader-box {
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }

        .mini-loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 85, 0, 0.3);
            border-top-color: var(--tf-orange);
            border-radius: 50%;
            animation: spin 0.7s infinite linear, pulseGlow 1s infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 5px var(--tf-orange); }
            to { box-shadow: 0 0 20px var(--tf-orange); }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="title">AUTOBOT JAILBREAK</div>
        <div class="subtitle">SYSTEM 0982440044 • FW 5.05 - 13.52</div>

        <div class="row">
            <span class="label">FIRMWARE</span>
            <span class="value" id="fw-info">Đang kiểm tra...</span>
        </div>

        <div class="row">
            <span class="label">TẢI TRỌNG</span>
            <span class="value" style="color: var(--tf-blue);">GoldHEN v2.4b18.12</span>
        </div>

        <div class="row">
            <span class="label">GIAO THỨC</span>
            <span class="value">QUANTUM MATRIX v2.0</span>
        </div>

        <div class="row">
            <span class="label">TRẠNG THÁI</span>
            <span class="value" id="msgs">
                <span class="loader-box">
                    <span class="mini-loader"></span>
                    <span class="warn">Đang khởi chạy hệ thống...</span>
                </span>
            </span>
        </div>
    </div>

    <script>
        (function () {
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            var fwVersion = isPS4 ? match[1] : "Unknown";
            var fwNum = parseFloat(fwVersion);

            var fwInfo = document.getElementById("fw-info");
            var msgs = document.getElementById("msgs");

            function setStatus(msgText, cls) {
                msgs.innerHTML = '<span class="' + (cls || '') + '">' + msgText + '</span>';
            }

            function onScriptError() {
                setStatus("Lỗi tệp! Xóa bộ nhớ đệm & Cài lại Cache...", "bad");
            }

            function loadScript(srcPath, isModule, onLoadCb) {
                var script = document.createElement('script');
                if (isModule) script.type = 'module';
                script.src = srcPath;
                script.onerror = onScriptError;
                script.onload = function () {
                    if (onLoadCb) onLoadCb();
                    setTimeout(function () {
                        if (script.parentNode) script.parentNode.removeChild(script);
                    }, 1000);
                };
                document.head.appendChild(script);
            }

            if (!isPS4) {
                fwInfo.textContent = "Không phải PS4";
                setStatus("Chỉ hỗ trợ phần cứng PlayStation 4", "bad");
            } else {
                fwInfo.innerHTML = fwVersion + ' · <span class="ok">SẴN SÀNG</span>';

                if (window.applicationCache && window.applicationCache.status == 0) {
                    if (fwNum == 5.05 || fwNum == 5.07) {
                        window.location.replace("cache505.html");
                    } else if (fwNum >= 7.00 && fwNum <= 8.52) {
                        window.location.replace("cache700.html");
                    } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                        window.location.replace("cache900.html");
                    } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                        window.location.replace("cachecss.html");
                    } else if (fwNum >= 11.50 && fwNum <= 13.52) {
                        window.location.replace("cacheslopkit.html");
                    } else {
                        fwInfo.innerHTML = fwVersion + ' · <span class="bad">KHÔNG HỖ TRỢ</span>';
                        setStatus("Phiên bản Firmware ngoài vùng phủ sóng", "bad");
                    }
                } else {
                    setStatus("Đang tải tệp tin GoldHEN...", "warn");

                    if (fwNum == 5.05 || fwNum == 5.07) {
                        loadScript("505/exploit.js", false);
                    }
                    else if (fwNum >= 7.00 && fwNum <= 8.52) {
                        loadScript("700/alert.js", true);
                    }
                    else if (fwNum >= 9.00 && fwNum <= 9.60) {
                        loadScript("900/alert.js", true);
                    }
                    else if (fwNum >= 10.00 && fwNum <= 11.02) {
                        loadScript("css/main.js", false, function () {
                            setTimeout(function () {
                                if (typeof doJb === "function") doJb();
                            }, 500);
                        });
                    }
                    else if (fwNum >= 11.50 && fwNum <= 12.02) {
                        loadScript("slopkit/chain_lapse.js", true);
                    }
                    else if (fwNum >= 12.50 && fwNum <= 13.00) {
                        loadScript("slopkit/chain_poops.js", true);
                    }
                    else if (fwNum >= 13.02 && fwNum <= 13.52) {
                        loadScript("slopkit/jb.js?v=10", true);
                    }
                }
            }
        })();
    </script>
</body>

</html>
