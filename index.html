<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUTO JAILBREAK PS4 - 0982440044</title>
    <style>
        :root {
            --theme-primary: #00f0ff;
            --theme-secondary: #ffe600;
            --bg-image: url('https://image.api.playstation.com/vulcan/ap/rnd/202111/1910/T1i7u4i9a8r2n4n3s6g0x7l8.png');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: border-color 0.4s ease, box-shadow 0.4s ease, color 0.4s ease;
        }

        body {
            background-color: #03060a;
            background-image: linear-gradient(rgba(3, 6, 10, 0.82), rgba(3, 6, 10, 0.90)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(6, 12, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid var(--theme-primary);
            border-radius: 10px;
            padding: 28px 24px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 20px var(--theme-primary);
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; height: 4px;
            background: var(--theme-secondary);
            box-shadow: 0 0 12px var(--theme-secondary);
        }

        .title {
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--theme-primary);
        }

        .subtitle {
            color: var(--theme-secondary);
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--theme-secondary);
        }

        /* Menu chọn game AAA */
        .game-picker {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .game-btn {
            background: rgba(10, 20, 38, 0.9);
            border: 2px solid #1e3a8a;
            color: #93c5fd;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .game-btn.active, .game-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--theme-primary);
            color: #ffffff;
            box-shadow: 0 0 12px var(--theme-primary);
        }

        .row {
            background: rgba(10, 20, 38, 0.75);
            border-left: 6px solid var(--theme-primary);
            border-top: 1px solid rgba(30, 58, 138, 0.6);
            border-right: 1px solid rgba(30, 58, 138, 0.6);
            border-bottom: 1px solid rgba(30, 58, 138, 0.6);
            border-radius: 4px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .label {
            color: #93c5fd;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .value {
            font-weight: 800;
            text-align: right;
            word-break: break-all;
            color: #ffffff;
        }

        .ok { color: #00ff66; text-shadow: 0 0 8px #00ff66; }
        .bad { color: #ff1e38; text-shadow: 0 0 8px #ff1e38; }
        .warn { color: var(--theme-secondary); text-shadow: 0 0 8px var(--theme-secondary); }

        .loader-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .mini-loader {
            width: 14px;
            height: 14px;
            border: 3px solid rgba(255, 119, 0, 0.3);
            border-top-color: var(--theme-secondary);
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="container" id="main-container">
        <div class="title" id="launcher-title">AUTO JAILBREAK PS4</div>
        <div class="subtitle" id="launcher-subtitle">0982440044 • CHỌN GIAO DIỆN GAME AAA</div>

        <!-- Khung chọn game -->
        <div class="game-picker">
            <button class="game-btn active" onclick="setTheme('cyberpunk', event)">Cyberpunk</button>
            <button class="game-btn" onclick="setTheme('gow', event)">God of War</button>
            <button class="game-btn" onclick="setTheme('sekiro', event)">Sekiro</button>
            <button class="game-btn" onclick="setTheme('witcher', event)">Witcher 3</button>
        </div>

        <div class="row">
            <span class="label">Firmware</span>
            <span class="value" id="fw-info">Đang kiểm tra...</span>
        </div>

        <div class="row">
            <span class="label">Tải trọng</span>
            <span class="value">GoldHEN v2.4b18.12</span>
        </div>

        <div class="row">
            <span class="label">Chủ đề hiện tại</span>
            <span class="value" id="theme-name" style="color: var(--theme-primary);">Cyberpunk 2077</span>
        </div>

        <div class="row">
            <span class="label">Trạng thái</span>
            <span class="value" id="msgs">
                <span class="loader-box">
                    <span class="mini-loader"></span>
                    <span class="warn">Đang khởi chạy...</span>
                </span>
            </span>
        </div>
    </div>

    <script>
        // Cấu hình hình nền artwork chuẩn chính hãng cho từng game
        const themes = {
            cyberpunk: {
                primary: "#00f0ff",
                secondary: "#ffe600",
                image: "url('https://images.alphacoders.com/105/thumb-1920-1051566.jpg')",
                name: "Cyberpunk 2077"
            },
            gow: {
                primary: "#ff3b30",
                secondary: "#ffcc00",
                image: "url('https://images.alphacoders.com/889/thumb-1920-889814.jpg')",
                name: "God of War (Runic)"
            },
            sekiro: {
                primary: "#ff8800",
                secondary: "#e2e8f0",
                image: "url('https://images.alphacoders.com/955/thumb-1920-955610.jpg')",
                name: "Sekiro: Shadows Die Twice"
            },
            witcher: {
                primary: "#10b981",
                secondary: "#94a3b8",
                image: "url('https://images.alphacoders.com/624/thumb-1920-624296.jpg')",
                name: "The Witcher 3 (Wolf)"
            }
        };

        function setTheme(themeKey, evt) {
            const t = themes[themeKey];
            const root = document.documentElement;
            
            root.style.setProperty('--theme-primary', t.primary);
            root.style.setProperty('--theme-secondary', t.secondary);
            root.style.setProperty('--bg-image', t.image);

            document.getElementById('theme-name').textContent = t.name;

            document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }

            try { localStorage.setItem('ps4_preferred_theme', themeKey); } catch(e){}
        }

        // Khôi phục chủ đề người dùng đã chọn lần trước
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const savedTheme = localStorage.getItem('ps4_preferred_theme');
                if (savedTheme && themes[savedTheme]) {
                    const btn = Array.from(document.querySelectorAll('.game-btn')).find(b => b.getAttribute('onclick').includes(savedTheme));
                    if (btn) {
                        document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const t = themes[savedTheme];
                        document.documentElement.style.setProperty('--theme-primary', t.primary);
                        document.documentElement.style.setProperty('--theme-secondary', t.secondary);
                        document.documentElement.style.setProperty('--bg-image', t.image);
                        document.getElementById('theme-name').textContent = t.name;
                    }
                }
            } catch(e){}
        });

        // Logic check Firmware & chạy Exploit gốc
        (function () {
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            var fwVersion = isPS4 ? match[1] : "Unknown";
            var fwNum = parseFloat(fwVersion);

            var fwInfo = document.getElementById("fw-info");
            var msgs = document.getElementById("msgs");

            function setStatus(msgText, cls) {
                msgs.innerHTML = '<span class="' + (cls || '') + '">' + msgText + '</span>';
            }

            function onScriptError() {
                setStatus("Lỗi tệp! Xóa dữ liệu web & cài lại Cache...", "bad");
            }

            function loadScript(srcPath, isModule, onLoadCb) {
                var script = document.createElement('script');
                if (isModule) script.type = 'module';
                script.src = srcPath;
                script.onerror = onScriptError;
                script.onload = function () {
                    if (onLoadCb) onLoadCb();
                    setTimeout(function () {
                        if (script.parentNode) script.parentNode.removeChild(script);
                    }, 1000);
                };
                document.head.appendChild(script);
            }

            if (!isPS4) {
                fwInfo.textContent = "Không phải PS4";
                setStatus("Chỉ hỗ trợ máy PS4 FW 5.05 và 7.00 - 13.52", "bad");
            } else {
                fwInfo.innerHTML = fwVersion + ' · <span class="ok">Được hỗ trợ</span>';

                if (window.applicationCache && window.applicationCache.status == 0) {
                    if (fwNum == 5.05 || fwNum == 5.07) {
                        window.location.replace("cache505.html");
                    } else if (fwNum >= 7.00 && fwNum <= 8.52) {
                        window.location.replace("cache700.html");
                    } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                        window.location.replace("cache900.html");
                    } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                        window.location.replace("cachecss.html");
                    } else if (fwNum >= 11.50 && fwNum <= 13.52) {
                        window.location.replace("cacheslopkit.html");
                    } else {
                        fwInfo.innerHTML = fwVersion + ' · <span class="bad">Không hỗ trợ</span>';
                        setStatus("Phiên bản FW không được hỗ trợ", "bad");
                    }
                } else {
                    setStatus("Đang tải GoldHEN... Vui lòng chờ", "warn");

                    if (fwNum == 5.05 || fwNum == 5.07) {
                        loadScript("505/exploit.js", false);
                    }
                    else if (fwNum >= 7.00 && fwNum <= 8.52) {
                        loadScript("700/alert.js", true);
                    }
                    else if (fwNum >= 9.00 && fwNum <= 9.60) {
                        loadScript("900/alert.js", true);
                    }
                    else if (fwNum >= 10.00 && fwNum <= 11.02) {
                        loadScript("css/main.js", false, function () {
                            setTimeout(function () {
                                if (typeof doJb === "function") doJb();
                            }, 500);
                        });
                    }
                    else if (fwNum >= 11.50 && fwNum <= 12.02) {
                        loadScript("slopkit/chain_lapse.js", true);
                    }
                    else if (fwNum >= 12.50 && fwNum <= 13.00) {
                        loadScript("slopkit/chain_poops.js", true);
                    }
                    else if (fwNum >= 13.02 && fwNum <= 13.52) {
                        loadScript("slopkit/jb.js?v=10", true);
                    }
                }
            }
        })();
    </script>
</body>

</html>
