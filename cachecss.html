<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIỆP PS4 - MATRIX 11.00</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #05080f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: #080f1e;
            border: 2px solid #00f0ff;
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            transform: translateZ(0);
            will-change: transform;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .sub {
            color: #ffe600;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .status {
            background: #0c1628;
            border-left: 5px solid #00f0ff;
            border-top: 1px solid #1e3a8a;
            border-right: 1px solid #1e3a8a;
            border-bottom: 1px solid #1e3a8a;
            border-radius: 4px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .progress-box {
            background: #0a101c;
            border: 1px solid #1e3a8a;
            border-radius: 6px;
            padding: 12px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 800;
            color: #93c5fd;
            margin-bottom: 8px;
        }

        .countdown-text {
            color: #ffe600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #00f0ff;
            border-radius: 5px;
            transition: width 0.2s linear;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">HIỆP PS4 • FW 10.00 - 11.02</div>
        <div class="sub">HOTLINE: 0982440044</div>
        
        <div class="status">
            <span id="msgs">Đang thực thi mã PPPoE / CSS...</span>
        </div>

        <div class="progress-box">
            <div class="progress-info">
                <span>TIẾN TRÌNH: <span id="percent-text" style="color: #00f0ff;">0%</span></span>
                <span class="countdown-text">TỰ ĐỘNG THỰC THI TRONG: <span id="timer-text">10</span>S</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var totalSeconds = 10;
            var currentMs = 0;
            var totalMs = totalSeconds * 1000;
            var intervalMs = 200;

            var fillEl = document.getElementById('progress-fill');
            var percentEl = document.getElementById('percent-text');
            var timerEl = document.getElementById('timer-text');

            var progressInterval = setInterval(function() {
                currentMs += intervalMs;
                var percentage = Math.min(Math.round((currentMs / totalMs) * 100), 100);
                var secondsLeft = Math.max(Math.ceil((totalMs - currentMs) / 1000), 0);

                if (fillEl) fillEl.style.width = percentage + '%';
                if (percentEl) percentEl.textContent = percentage + '%';
                if (timerEl) timerEl.textContent = secondsLeft;

                if (currentMs >= totalMs) {
                    clearInterval(progressInterval);
                }
            }, intervalMs);
        })();
    </script>

    <script src="css/main.js"></script>
    <script>
        setTimeout(function() { if (typeof doJb === "function") doJb(); }, 500);
    </script>
</body>

</html>
