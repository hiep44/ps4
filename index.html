<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIỆP PS4 - JAILBREAK MATRIX HOST</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070a12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: rgba(12, 18, 32, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.3);
            clip-path: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            padding: 30px 25px;
            text-align: center;
            position: relative;
            transform: translateZ(0);
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
        }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 4px 10px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #00f0ff;
            border-radius: 50%;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .sub {
            color: #ffcc00;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Khung báo Auto Redirect & Thanh Progress Bar */
        .auto-banner {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid #00f0ff;
            color: #ffffff;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .banner-text {
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, #ffcc00);
            transition: width 0.2s linear;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-fw {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-left: 4px solid #00f0ff;
            padding: 16px 20px;
            text-decoration: none;
            color: #ffffff;
            transition: background 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
        }

        .btn-fw.detected {
            border-color: #ffcc00;
            border-left-color: #ffcc00;
            background: rgba(255, 204, 0, 0.15);
        }

        .btn-fw-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-align: left;
        }

        .btn-fw-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
        }

        .btn-fw-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            background: rgba(255, 230, 0, 0.1);
            color: #ffcc00;
            border: 1px solid rgba(255, 230, 0, 0.3);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .footer-info {
            background: rgba(5, 10, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-tag"><span class="dot"></span> MATRIX HOST SELECTOR</div>
        <div class="title">HIỆP PS4 • EXPLOIT HOST</div>
        <div class="sub">HOTLINE: 0982440044</div>

        <!-- Thông báo tự động lựa chọn & Đếm % -->
        <div id="auto-banner" class="auto-banner">
            <div class="banner-text">
