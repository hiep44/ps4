<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIỆP 44 - PS4 AUTO HOST SELECTOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0e14; 
            color: #fff; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background-color: #121824;
            border: 1px solid #1c2638;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .brand-title { 
            color: #0088ff; 
            font-size: 26px; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .brand-sub { 
            color: #00ffcc; 
            font-size: 18px; 
            font-weight: 700;
            margin-bottom: 12px;
        }
        .brand-desc {
            color: #a0aec0;
            font-size: 15px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1c2638;
        }
        .msg { 
            font-size: 16px; 
            color: #ffffff; 
            font-weight: 600;
            min-height: 24px;
            margin-bottom: 16px;
        }
        .timer-box {
            font-size: 14px;
            color: #8c9ba5;
            margin-bottom: 12px;
        }
        .timer-count {
            color: #0088ff;
            font-weight: bold;
            font-size: 18px;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #1c2638;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #0088ff;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-title">HIỆP 44 PLAYSTATION</div>
        <div class="brand-sub">Hotline: 0982 440 044</div>
        <div class="brand-desc">Chuyên mua bán - trao đổi máy & phụ kiện PlayStation</div>

        <div class="msg" id="msg">Đang kiểm tra phiên bản Firmware...</div>
        
        <div class="timer-box" id="timer-box" style="display: none;">
            Tự động chuyển hướng sau <span class="timer-count" id="countdown">10</span> giây...
        </div>

        <div class="progress-bar" id="progress-bar" style="display: none;">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <script>

        var msg = document.getElementById('msg');

        var countdownEl = document.getElementById('countdown');

                msg.textContent = "Phát hiện FW 5.05!";
                targetUrl = "cache505.html";

                targetUrl = "cache700.html";
            } else if (ua.indexOf("9.00") !== -1) {
                msg.textContent = "Phát hiện FW 9.00!";
                targetUrl = "cache900.html";

                msg.textContent = "Phát hiện FW cao (PPPwn / Slopkit)!";
                targetUrl = "cacheslopkit.html";
            } else {
                msg.textContent = "Phát hiện FW 9.xx / CSS!";
                targetUrl = "cachecss.html";
            }

            // Bắt đầu đếm ngược 10 giây
            startCountdown(targetUrl);
        } else {
            msg.textContent = "Bạn đang truy cập từ Máy tính/Điện thoại. Hãy mở trang này bằng Trình duyệt PS4 để hack máy.";
        }

            progressBar.style.display = "block";

                progressFill.style.width = percent + "%";
